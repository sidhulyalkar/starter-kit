name: G3 physics audit and recursive forecasts

on:
  push:
    branches: ["feat/g3-physics-audit"]
    paths:
      - ".github/workflows/g3-physics-recursion.yml"
      - "scripts/diagnose_zone_physics.py"
      - "scripts/evaluate_recursive_ridge.py"
      - "smart_buildings/experiments/thermal_recursive.py"
      - "tests/test_zone_physics_report.py"
      - "tests/test_thermal_recursive.py"
  pull_request:
    paths:
      - ".github/workflows/g3-physics-recursion.yml"
      - "scripts/diagnose_zone_physics.py"
      - "scripts/evaluate_recursive_ridge.py"
      - "smart_buildings/experiments/thermal_recursive.py"
      - "tests/test_zone_physics_report.py"
      - "tests/test_thermal_recursive.py"
  workflow_dispatch:

jobs:
  audit-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install official simulator and test runner
        run: python -m pip install -e . pytest
      - name: Validate physics event accounting and recursive no-leakage logic
        run: |
          python -m pytest -q \
            tests/test_zone_physics_report.py \
            tests/test_thermal_recursive.py \
            tests/test_thermal_ridge.py \
            tests/test_thermal_shocks.py
      - name: Diagnose VAV 1 simulated physics in Denver
        run: |
          python -m scripts.diagnose_zone_physics \
            --building building_train_2 --weather denver_8 \
            --policy pid_water --zone VAV_1 --steps 288 --threshold-k 2 \
            --results-dir smart_buildings/results/g3_physics
      - name: Collect training building 1 trajectory
        run: |
          python -m scripts.profile_control \
            --building building_train_1 --weather atlanta_2 \
            --policies pid_water --steps 288 --record-transitions \
            --results-dir smart_buildings/results/g3_recursive
      - name: Collect independent evaluation building 2 trajectory
        run: |
          python -m scripts.profile_control \
            --building building_train_2 --weather denver_8 \
            --policies pid_water --steps 288 --record-transitions \
            --results-dir smart_buildings/results/g3_recursive
      - name: Evaluate frozen-context recursive 5/15/60-min forecast
        run: |
          python -m scripts.evaluate_recursive_ridge \
            --train smart_buildings/results/g3_recursive/building_train_1/atlanta_2/pid_water/transitions.jsonl.gz \
            --eval smart_buildings/results/g3_recursive/building_train_2/denver_8/pid_water/transitions.jsonl.gz \
            --alpha 100 --horizons 1 3 12 --stride 12 \
            --out smart_buildings/results/g3_recursive/recursive_report.json
      - name: Save simulator physics and forecast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-physics-and-recursive-evidence
          path: |
            smart_buildings/results/g3_physics/
            smart_buildings/results/g3_recursive/
          if-no-files-found: warn
          retention-days: 14
