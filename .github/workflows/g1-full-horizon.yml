name: G1 full-horizon paired qualification

on:
  push:
    branches: ["feat/adaptive-pid-qualification"]
    paths:
      - ".github/workflows/g1-full-horizon.yml"
  workflow_dispatch:

jobs:
  full-public-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned simulator dependencies
        run: python -m pip install -e .
      - name: Profile complete 30-day scenario (8640 steps), PID-water vs adaptive
        run: |
          python -m scripts.profile_control \
            --building building_train_1 --weather atlanta_2 \
            --policies pid_water adaptive --steps 8640 \
            --results-dir smart_buildings/results/g1_full
      - name: Check paired full-horizon outcomes
        run: |
          python -m scripts.compare_adaptive smart_buildings/results/g1_full \
            --candidate adaptive --reference pid_water \
            --expect 1 --steps 8640 \
            --csv smart_buildings/results/g1_full/comparison.csv
      - name: Preserve all evidence including failed job outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-full-horizon-one-public-scenario
          path: smart_buildings/results/g1_full/
          if-no-files-found: warn
          retention-days: 14
