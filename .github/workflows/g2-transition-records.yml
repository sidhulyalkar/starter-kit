name: G2 thermal transition integrity

on:
  push:
    branches: ["feat/thermal-transition-dataset"]
    paths:
      - "smart_buildings/experiments/thermal_records.py"
      - "smart_buildings/experiments/thermal_splits.py"
      - "scripts/profile_control.py"
      - "tests/test_thermal_records.py"
      - "tests/test_thermal_splits.py"
      - ".github/workflows/g2-transition-records.yml"
  pull_request:
    paths:
      - "smart_buildings/experiments/thermal_records.py"
      - "smart_buildings/experiments/thermal_splits.py"
      - "scripts/profile_control.py"
      - "tests/test_thermal_records.py"
      - "tests/test_thermal_splits.py"
      - ".github/workflows/g2-transition-records.yml"
  workflow_dispatch:

jobs:
  record-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install simulator and tests
        run: python -m pip install -e . pytest
      - name: Thermal record schema, integrity and leakage tests
        run: python -m pytest -q tests/test_thermal_records.py tests/test_thermal_splits.py
      - name: Capture actual simulator transitions (diagnostic dataset only)
        run: |
          python -m scripts.profile_control \
            --building building_train_1 --weather atlanta_2 \
            --policies pid_water --steps 12 \
            --record-transitions \
            --results-dir smart_buildings/results/g2_data_smoke
      - name: Verify generated archive and sample alignment
        run: |
          python -c "from pathlib import Path; from smart_buildings.experiments.thermal_records import verify_archive; p=Path('smart_buildings/results/g2_data_smoke/building_train_1/atlanta_2/pid_water/transitions.jsonl.gz'); m=verify_archive(p); assert m['record_count']==12; print('Verified',m['record_count'],'transitions and SHA256 integrity')"
      - name: Preserve dataset manifest and archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-12-step-thermal-dataset
          path: smart_buildings/results/g2_data_smoke/
          retention-days: 14
          if-no-files-found: warn
