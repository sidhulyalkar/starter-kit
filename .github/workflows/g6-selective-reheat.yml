name: G6 observation-only selective reheat pilot

on:
  push:
    branches: ["feat/g6-selective-reheat-guard"]
    paths:
      - ".github/workflows/g6-selective-reheat.yml"
      - "smart_buildings/experiments/selective_reheat.py"
      - "scripts/run_selective_reheat.py"
      - "tests/test_selective_reheat.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - building: building_train_2
            weather: denver_8
          - building: building_train_4
            weather: denver_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install unchanged official simulator and tests
        run: python -m pip install -e . pytest
      - name: Pure observations, normalized action and state reset checks
        run: python -m pytest -q tests/test_selective_reheat.py tests/test_vav_interventions.py
      - name: Run 288-step public pilot with sham, fixed negative control, selective arms
        run: |
          python -m scripts.run_selective_reheat \
            --building ${{ matrix.building }} \
            --weather ${{ matrix.weather }} \
            --steps 288 \
            --results-dir smart_buildings/results/g6_pilot
      - name: Verify sham match and preserve inactive experimental arms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("smart_buildings/results/g6_pilot/paired_selective_pilot.json")
          r=json.loads(p.read_text())
          assert r["sham_reproduces_reference"] is True
          assert len(r["arms"]) == 5
          assert {x["total_steps"] for x in r["arms"]} == {288}
          print("Five matched arms, 288 steps, sham validated")
          PY
      - name: Archive negative/positive results separately by building and climate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-selective-${{ matrix.building }}-${{ matrix.weather }}
          path: smart_buildings/results/g6_pilot/
          retention-days: 30
          if-no-files-found: warn
