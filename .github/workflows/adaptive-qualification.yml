name: Adaptive PID qualification

on:
  pull_request:
    paths:
      - "smart_buildings/experiments/**"
      - "scripts/run_adaptive_experiments.py"
      - "scripts/compare_adaptive.py"
      - "tests/test_adaptive_*.py"
      - "tests/test_compare_adaptive.py"
      - ".github/workflows/adaptive-qualification.yml"
  push:
    branches:
      - "feat/adaptive-pid-qualification"
    paths:
      - "smart_buildings/experiments/**"
      - "scripts/run_adaptive_experiments.py"
      - "scripts/compare_adaptive.py"
      - "tests/test_adaptive_*.py"
      - "tests/test_compare_adaptive.py"
      - ".github/workflows/adaptive-qualification.yml"
  workflow_dispatch:

jobs:
  unit-and-real-simulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install competition simulator and tests
        run: python -m pip install -e . pytest
      - name: Test control math and benchmarking
        run: python -m pytest -q tests/test_adaptive_core.py tests/test_compare_adaptive.py
      - name: Real simulator action-contract tests
        run: python -m pytest -q tests/test_adaptive_integration.py
      - name: Actual evaluator integration smoke (not comparable with published score)
        run: |
          python -m scripts.run_adaptive_experiments \
            --policies pid_water adaptive_sensor adaptive_outlier adaptive_forecast adaptive \
            --buildings building_train_1 --weathers atlanta_2 \
            --steps 12 --results-dir /tmp/smart_buildings_smoke
      - name: Check paired short-episode evaluator outputs (diagnostic only)
        run: |
          python -m scripts.compare_adaptive /tmp/smart_buildings_smoke \
            --candidate adaptive --reference pid_water --expect 1 --steps 12
